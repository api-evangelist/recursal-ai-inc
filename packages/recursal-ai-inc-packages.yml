  registry: pypi
  name: openai
  url: https://pypi.org/project/openai/
  install: pip install openai
  official: false
  note: >-
    Documented client. Configure OpenAI(base_url="https://api.featherless.ai/v1",
    api_key="FEATHERLESS_API_KEY").
- language: javascript
  registry: npm
  name: openai
  url: https://www.npmjs.com/package/openai
