summary: >-
  Recursal AI / Featherless does not publish a first-party client SDK. Because
  the inference API is OpenAI-compatible, the documentation directs developers
  to use the standard OpenAI SDKs (Python / JavaScript) with the base URL set to
  https://api.featherless.ai/v1. The recommended clients below are third-party
  and are NOT marked official.
packages:
