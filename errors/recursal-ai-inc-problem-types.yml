- status: 400
  title: This model is cold / not ready for inference
  meaning: >-
    The model exists but has not been loaded into GPU. Models have three states:
    cold, loading, and warm.
  remediation: >-
    Load/warm the model first. Warm-up time varies by model size (5 minutes to
    1 hour).
