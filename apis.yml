aid: recursal-ai-inc
name: Recursal AI, Inc.
description: >-
  Recursal AI, Inc. operates Featherless AI, a serverless AI inference platform
  that provides unified, OpenAI-compatible API access to tens of thousands of
  open-weight large language models sourced from Hugging Face. A single API key
  and base URL (https://api.featherless.ai/v1) give developers drop-in access to
  models ranging from small 7B instruct models to 405B-plus parameter models,
  under flat-rate, concurrency-based subscriptions with unlimited monthly
  requests and a no-logging policy on prompts and chat history. The platform is
  built by researchers who contribute to RWKV, a Linux Foundation project, and
  has raised a $20M Series A. Recursal AI was surfaced as a portfolio company of
  500 Global and enriched by the API Evangelist pipeline.
